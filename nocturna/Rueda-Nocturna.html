<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rueda Nocturna | Rueda Libre</title>
    <link rel="stylesheet" href="src/output.css">
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <nav class="border-b border-slate-800 bg-slate-950 px-6 py-5 sm:px-10" aria-label="Navegación principal">
      <div class="mx-auto flex w-full max-w-5xl flex-wrap items-center justify-between gap-4">
        <a href="../nocturna/index.html" class="text-xl font-black tracking-tight text-white">Rueda Libre</a>
        <div class="flex flex-wrap gap-5 text-sm font-semibold text-slate-300">
          <a href="../nocturna/index.html" class="transition hover:text-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300">Inicio</a>
          <a href="#rutas" class="transition hover:text-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300">Rutas</a>
          <a href="../nocturna/Rueda-Nocturna.html" class="transition hover:text-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300">Inscríbete</a>
        </div>
      </div>
    </nav>

    <main id="inicio" class="flex min-h-screen items-center justify-center p-6 sm:p-10">
      <section class="m-0 w-full max-w-5xl rounded-3xl bg-slate-900 p-8 shadow-2xl sm:p-12" aria-labelledby="rueda-nocturna-titulo">
        <div class="max-w-3xl space-y-6">
          <p class="text-sm font-bold uppercase tracking-[0.2em] text-amber-300">Nuevo · Jueves a sábado</p>
          <h1 id="rueda-nocturna-titulo" class="text-4xl font-black leading-tight tracking-tight text-white sm:text-6xl">Rueda Nocturna</h1>
          <p class="max-w-2xl text-lg leading-8 text-slate-300 sm:text-2xl">Descubre Medellín en bici cuando se encienden las luces</p>

          <div class="flex flex-wrap gap-4 pt-2" aria-label="Datos destacados">
            <p class="rounded-full bg-slate-800 px-5 py-3 text-base font-bold text-emerald-300">3 rutas</p>
            <p class="rounded-full bg-slate-800 px-5 py-3 text-base font-bold text-amber-300">Desde $55.000</p>
          </div>

          <div id="inscripcion" class="flex flex-wrap gap-4 pt-2" aria-label="Acciones de la campaña">
            <button type="button" class="rounded-full bg-amber-400 px-7 py-4 text-base font-extrabold text-slate-950 shadow-lg transition hover:bg-amber-300 focus:outline-none focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-900 focus-visible:outline-4 focus-visible:outline-amber-200 focus-visible:outline-offset-2">Inscríbete</button>
            <button type="button" class="rounded-full bg-emerald-500 px-7 py-4 text-base font-extrabold text-white shadow-lg transition hover:bg-emerald-400 focus:outline-none focus:ring-4 focus:ring-emerald-200 focus:ring-offset-2 focus:ring-offset-slate-900 focus-visible:outline-4 focus-visible:outline-emerald-200 focus-visible:outline-offset-2">Ver rutas</button>
            <button type="button" class="rounded-full border-2 border-amber-300 px-7 py-4 text-base font-extrabold text-amber-200 shadow-lg transition hover:bg-amber-300 hover:text-slate-950 focus:outline-none focus:ring-4 focus:ring-amber-200 focus:ring-offset-2 focus:ring-offset-slate-900 focus-visible:outline-4 focus-visible:outline-amber-200 focus-visible:outline-offset-2">Conocer beneficios</button>
          </div>
        </div>
      </section>
    </main>

    <footer id="rutas" class="border-t border-slate-800 bg-slate-900 px-6 py-8 text-center text-sm text-slate-400 sm:px-10">
      <p class="font-semibold text-slate-200">Rueda Libre</p>
      <p class="mt-2">Rutas nocturnas en bicicleta por Medellín · contacto@ruedalibre.co</p>
    </footer>
  </body>
</html>
